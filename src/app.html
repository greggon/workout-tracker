<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover lets the sticky header paint into the notch;
		     the header pads itself back out with env(safe-area-inset-top). -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#161826" />
		<!-- Stops Android and iOS turning weights like 117.5 into tappable phone links. -->
		<meta name="format-detection" content="telephone=no" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icon.svg" />
		<meta name="color-scheme" content="light dark" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Workout" />
		<script>
			/*
			 * Stamps the saved theme before the first paint. Without this the
			 * page renders in the OS theme and then flips, which on a dark
			 * phone at 6am is a white flash in the face.
			 */
			try {
				var t = localStorage.getItem('workout.theme');
				if (t === 'light' || t === 'dark') {
					document.documentElement.setAttribute('data-theme', t);
					document
						.querySelector('meta[name="theme-color"]')
						.setAttribute('content', t === 'light' ? '#eceff8' : '#161826');
				}
			} catch (e) {
				/* storage blocked; the media query still gives a sensible theme */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
